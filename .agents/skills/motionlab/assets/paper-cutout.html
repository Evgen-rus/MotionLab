<!doctype html><html lang="ru"><meta charset="utf-8"><title>Paper Cutout — MotionLab</title>
<style>
@font-face{font-family:Manrope;src:url('fonts/Manrope-Variable.ttf');font-weight:200 800}
@font-face{font-family:'DejaVu Serif';src:url('fonts/DejaVuSerif-BoldItalic.ttf') format('truetype');font-weight:700;font-style:italic;font-display:block}
main{font-synthesis:none}
*{box-sizing:border-box}body{margin:0}main{position:relative;width:640px;height:360px;overflow:hidden;background:#e7ddc4;color:#20261e;padding:38px;font-family:Manrope}
main:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.13;background:repeating-linear-gradient(13deg,transparent 0 3px,#8a7958 4px,transparent 5px 9px)}
small{font-weight:800;letter-spacing:3px}h1{position:relative;font:italic bold 53px/1.1 'DejaVu Serif';margin:24px 0 12px;padding:10px 16px;width:max-content;background:#fdf7e8;filter:drop-shadow(3px 6px 2px #0003);clip-path:polygon(1% 3%,98% 0,100% 94%,2% 100%,0 63%)}
p{background:#e85b36;width:max-content;padding:12px 20px;font-weight:800;transform:rotate(-3deg)}b{position:absolute;right:38px;top:40px;font-size:90px;color:#317b58;transform:rotate(15deg)}
</style><main><small>БУМАЖНЫЙ КОЛЛАЖ</small><b>✳</b><h1>Идея в движении</h1><p>Ваш текст. Ваш стиль. Новый ролик.</p></main>
<script>
const ready=Promise.all([document.fonts.load('800 20px Manrope','Ёж Йод'),document.fonts.load('italic 700 53px "DejaVu Serif"','Ёж Йод')]).then(results=>{if(results.some(f=>!f.length))throw Error('Paper Cutout font failed to load')});
window.__video={duration:2,fps:30,size:[640,360],async seek(t){await ready;const p=Math.max(0,Math.min(1,(t-.15)/.3));document.querySelector('h1').style.transform=`translateY(${(1-p)*35}px) rotate(${-2*p}deg)`;document.querySelector('h1').style.opacity=p;}};
</script></html>
