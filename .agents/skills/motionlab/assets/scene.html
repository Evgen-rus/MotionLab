<!doctype html><html lang="ru"><meta charset="utf-8"><title>MotionLab demo</title>
<style>
@font-face{font-family:Manrope;src:url('fonts/Manrope-Variable.ttf') format('truetype');font-style:normal;font-weight:200 800;font-display:block}
*{box-sizing:border-box}body{margin:0;background:#101222;color:#fff;font-family:Manrope,sans-serif;font-weight:500;font-synthesis:none}
#stage{width:640px;height:360px;padding:46px;overflow:hidden;background:radial-gradient(ellipse at 90% 0%,#253f76,transparent 62%),radial-gradient(ellipse at 0% 100%,#35224f,transparent 65%),#101222}
h1{margin:0 0 14px;font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1.18}
.sub{color:#bac7df;font-size:16px;font-weight:500;line-height:1.5}
.cards{display:flex;gap:12px;margin-top:26px}
.card{padding:18px 15px;background:linear-gradient(#1a233a,#1a233a) padding-box,linear-gradient(120deg,#a170ff,#58caff) border-box;border:1px solid transparent;border-radius:14px;font-size:16px;font-weight:500;width:166px}
.tag{background:linear-gradient(100deg,#b38aff,#5cd1ff);background-clip:text;-webkit-background-clip:text;color:transparent;width:max-content;font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:12px}
</style><main id="stage" data-scene-id="intro" data-scene-name="Вступление" data-start="0" data-end="2"><div class="tag" data-element-id="brand" data-element-name="Название" data-element-type="Текст" data-start="0" data-end="2" data-motion="Появление снизу · 0,65 с">MOTIONLAB / ВАШ ДИЗАЙН</div><h1 data-element-id="headline" data-element-name="Заголовок" data-element-type="Текст" data-start="0.12" data-end="2" data-motion="Появление снизу · 0,65 с">Идея в движении</h1><div class="sub" data-element-id="subtitle" data-element-name="Подпись" data-element-type="Текст" data-start="0.24" data-end="2" data-motion="Появление снизу · 0,65 с">Ваш текст. Ваш стиль. Новый ролик.</div><div class="cards"><div class="card" data-element-id="reference" data-element-name="Карточка референса" data-element-type="Карточка" data-start="0.36" data-end="2" data-motion="Появление снизу · 0,65 с">Референс</div><div class="card" data-element-id="movement" data-element-name="Карточка движения" data-element-type="Карточка" data-start="0.48" data-end="2" data-motion="Появление снизу · 0,65 с">Движение</div><div class="card" data-element-id="result" data-element-name="Карточка результата" data-element-type="Карточка" data-start="0.60" data-end="2" data-motion="Появление снизу · 0,65 с">Результат</div></div></main>
<script>
// Deterministic seek contract: no wall-clock animation or randomness.
const fontsReady=Promise.all([document.fonts.load('800 40px Manrope'),document.fonts.load('500 16px Manrope')]).then(results=>{if(results.some(faces=>faces.length===0))throw Error('Manrope failed to load');});
window.__video={duration:2,fps:24,size:[640,360],async seek(t){
 await fontsReady;
 document.querySelectorAll('[data-motion]').forEach((el,i)=>{
  const p=Math.min(1,Math.max(0,(t-i*0.12)/0.65)),e=1-(1-p)**3;
  el.style.opacity=p;el.style.transform=`translateY(${(1-e)*30}px)`;
 });
}};
window.__video.seek(0);
</script></html>
